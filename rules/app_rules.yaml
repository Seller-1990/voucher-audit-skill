thresholds:
  drift_dominance_ratio: 0.7
  gross_margin: {}

aio:
  enabled_default: false
  model: "gpt-5.4"
  base_url: ""
  api_key_env: "OPENAI_API_KEY"
  max_items_per_section: 40
  max_output_tokens: 1200

annotation_policy:
  enabled_default: true
  gap_columns: 1

report_format:
  sheet_names:
    overview: "概览"
    aux_rule_violations: "入账规则违规_辅助帐"
